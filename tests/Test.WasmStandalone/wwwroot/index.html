<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test.WasmStandalone</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script>
        (function () {
            function applyTheme(dark) {
                document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
                var el = document.getElementById('hljs-theme');
                if (el) el.href = el.href.replace(
                    dark ? /vs\.min\.css/ : /vs2015\.min\.css/,
                    dark ? 'vs2015.min.css' : 'vs.min.css'
                );
            }
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            applyTheme(mq.matches);
            mq.addEventListener('change', function (e) { applyTheme(e.matches); });
        })();
    </script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/SamovarGrid/samovar.grid.css" />
    <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/vs.min.css" integrity="sha512-AVoZ71dJLtHRlsgWwujPT1hk2zxtFWsPlpTPCc/1g0WgpbmlzkqlDFduAvnOV4JJWKUquPc1ZyMc5eq4fRnKOQ==" crossorigin="anonymous"/>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Test.WasmStandalone.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" integrity="sha512-EBLzUL8XLl+va/zAsmXwS7Z2B1F9HUHkZwyS/VKwh3S7T/U0nF4BaU29EP/ZSf6zgiIxYAnKLu6bJ8dqpmX5uw==" crossorigin="anonymous"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
